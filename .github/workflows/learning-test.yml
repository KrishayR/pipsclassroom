name: Five-hour learning test

# Paid calls happen only when someone explicitly clicks Run workflow.
on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: Branch or commit to test from this repository
        type: string
        default: codex/muse-throughput
        required: true
      budget_usd:
        description: Maximum estimated Muse spend (above 0, at most 20 USD)
        type: number
        default: 20
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-learning-test
  cancel-in-progress: false

jobs:
  learning-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check configuration without API calls
        run: node --import tsx scripts/cloud-learning.ts
        env:
          CLOUD_BUDGET_USD: ${{ inputs.budget_usd }}
      - name: Run the classroom for up to five hours
        timeout-minutes: 330
        run: node --experimental-sqlite --import tsx scripts/cloud-learning.ts --live
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CLOUD_BUDGET_USD: ${{ inputs.budget_usd }}
          MODEL_BASE_URL: https://api.meta.ai/v1
          MODEL_ID: muse-spark-1.3-contributor
          MODEL_STUDENT_HELPER: "on"
          MODEL_USE_PLANNER: "true"
          MODEL_STUDENT_REASONING_EFFORT: low
          MODEL_TEACHER_REASONING_EFFORT: low
          MODEL_EXAM_CONCURRENCY: "6"
          MODEL_RPM: "120"
          MODEL_MAX_COMPLETION_TOKENS: "4000"
          MODEL_OUTAGE_WAIT_MS: "600000"
          MODEL_PRICE_INPUT_PER_M: "0.10"
          MODEL_PRICE_CACHED_INPUT_PER_M: "0.002"
          MODEL_PRICE_OUTPUT_PER_M: "0.20"
          MODEL_KEY_LEDGER: cloud-results/key-spend.json
      - name: Save full and partial results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: learning-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
